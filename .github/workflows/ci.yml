name: CI

# Pull requests run the fast checks once (not again for the branch push). The installer
# builds (macOS counts 10x, Windows 2x in Actions minutes) run on main and by hand only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fips:
        description: "Build the installers on the FIPS 140-3 module (D-006). Verify here before it becomes the default."
        type: boolean
        default: false

# Least privilege: read the code, nothing else. No secrets are used anywhere.
# Every action is pinned to a commit (STANDARDS 5.8); Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DV_BUILD_COMMIT: ${{ github.sha }}

jobs:
  rust:
    name: Rust – fmt, clippy, tests, invariants, scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Local OCR (D-048): the scan tests run against the real engine with Hebrew.
      - name: Tesseract with Hebrew
        run: sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-heb
      - run: cargo test
        env:
          DV_REQUIRE_OCR: "1"
      - name: IPC TypeScript bindings are up to date
        run: git diff --exit-code -- apps/desktop/src/ipc/generated
      - run: cargo xtask check-invariants
      - run: cargo xtask scan --all

  supply-chain:
    name: Supply chain – cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  fips:
    name: FIPS 140-3 module – vault tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p dv-vault --features fips
      - run: cargo test -p dv-export --features fips

  windows:
    name: Windows – the vault, documents and updates, as released
    # The clinician runs Windows; the installer is built there, but nothing ran there before a
    # release. Release profile, so optimizations and overflow checks are what she runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Before this job, every vault test died here with STATUS_STACK_OVERFLOW (D-038).
      - run: cargo test --release -p dv-vault -p dv-egress -p dv-ingest -p dv-sandbox
      - name: First run (create, close, open again; the real Argon2 cost)
        run: cargo test --release -p dv-core --test first_run -- --ignored

  windows-shell:
    name: Windows – desktop shell on the FIPS module, as released
    # D-047: the release is built on the FIPS 140-3 module (S-6), and the shell's only native
    # Windows code (locked memory, crash reports, Windows Hello) runs here before it ships.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: FIPS build tools
        run: |
          choco install nasm ninja -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # The shell embeds the built UI at compile time.
      - run: pnpm build
        working-directory: apps/desktop
      - run: cargo test --release -p dv-vault --features fips
      # Tauri checks that bundled resources exist even when nothing is bundled. This job builds
      # no installer, so an empty folder stands in for the OCR engine (D-048); the installer
      # jobs (desktop, release) fetch the real one.
      - name: OCR resource folder (no installer here)
        shell: pwsh
        run: New-Item -ItemType Directory -Force apps/desktop/src-tauri/ocr/tessdata | Out-Null
      - run: cargo clippy -p dv-desktop --features fips -- -D warnings
      - run: cargo test --release -p dv-desktop --features fips

  frontend:
    name: UI – typecheck, lint, tests, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  desktop:
    name: Desktop build – ${{ matrix.os }}
    needs: [rust, frontend]
    # Installers: after a merge to main, or "Run workflow" on any branch (Actions tab).
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One file to send: a per-user setup (no admin prompt) with WebView2 bundled.
          - os: windows-latest
            bundles: nsis
            artifact: diagnostic-vault-windows
            paths: |
              target/release/bundle/nsis/*.exe
          # Ad-hoc signed (tauri.conf.json): Gatekeeper offers "Open Anyway" instead of "damaged".
          - os: macos-latest
            bundles: app,dmg
            artifact: diagnostic-vault-macos
            paths: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb
            artifact: diagnostic-vault-linux
            paths: |
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # FIPS build (aws-lc-fips-sys): Go everywhere; NASM and Ninja on Windows.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.fips
        with:
          go-version: stable
      - name: FIPS build tools (Windows)
        if: inputs.fips && runner.os == 'Windows'
        run: |
          choco install nasm ninja -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # The installer carries the OCR engine (D-048); built from source, pinned.
      - name: OCR engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: apps/desktop/src-tauri/windows/fetch-ocr.ps1
      - name: Clippy on the desktop shell
        run: cargo clippy -p dv-desktop -- -D warnings
      - name: Build installer (unsigned; signing is phase 8)
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ inputs.fips && '--features fips' || '' }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
