name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: read the code, nothing else. No secrets are used anywhere.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DV_BUILD_COMMIT: ${{ github.sha }}

jobs:
  rust:
    name: Rust – fmt, clippy, tests, invariants, scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: IPC TypeScript bindings are up to date
        run: git diff --exit-code -- apps/desktop/src/ipc/generated
      - run: cargo xtask check-invariants
      - run: cargo xtask scan --all

  supply-chain:
    name: Supply chain – cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  fips:
    name: FIPS 140-3 module – vault tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p dv-vault --features fips
      - run: cargo test -p dv-export --features fips

  frontend:
    name: UI – typecheck, lint, tests, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  desktop:
    name: Desktop build – ${{ matrix.os }}
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: diagnostic-vault-windows
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - os: macos-latest
            bundles: app,dmg
            artifact: diagnostic-vault-macos
            paths: |
              target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb
            artifact: diagnostic-vault-linux
            paths: |
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux WebView libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Clippy on the desktop shell
        run: cargo clippy -p dv-desktop -- -D warnings
      - name: Build installer (unsigned; signing is phase 8)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
