name: Release

# One file, one permanent link (D-026): pushing a tag like `v0.2.0` builds the one-click Windows
# installer and attaches it to a GitHub Release under a fixed name, so the newest version is
# always at .../releases/latest/download/DiagnosticVault-Setup.exe.
on:
  push:
    tags: ["v*"]

# Read by default; only the job that publishes the release may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DV_BUILD_COMMIT: ${{ github.sha }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # Nothing is released that leaks: the adversarial suite and canary must show 0 leaks.
      - name: Privacy suite (0 leaks)
        run: cargo test -p dv-privacy
      - name: Build the one-click installer
        run: pnpm tauri build --bundles nsis
        working-directory: apps/desktop
      - name: Fixed name and checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName DiagnosticVault-Setup.exe
          (Get-FileHash DiagnosticVault-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  DiagnosticVault-Setup.exe" | Out-File -Encoding ascii DiagnosticVault-Setup.exe.sha256
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="DiagnosticVault-Setup.exe DiagnosticVault-Setup.exe.sha256"
          # A release drafted in the GitHub page already exists: attach to it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" \
              --title "כספת האבחון $GITHUB_REF_NAME" \
              --notes "להתקנה: להוריד את DiagnosticVault-Setup.exe וללחוץ עליו פעמיים. רק נתונים בדויים עד שכל תנאי שלב 8 מתקיימים (docs/external/README.md)."
          fi
