name: Release

# One file, one permanent link (D-026): pushing a tag like `v0.2.0` builds the one-click Windows
# installer and attaches it to a GitHub Release under a fixed name, so the newest version is
# always at .../releases/latest/download/DiagnosticVault-Setup.exe.
on:
  push:
    tags: ["v*"]

# Read by default; only the job that publishes the release may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DV_BUILD_COMMIT: ${{ github.sha }}

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      # All encryption on the FIPS 140-3 validated module (D-006, D-047): Go, NASM and Ninja.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: FIPS build tools
        run: |
          choco install nasm ninja -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Nothing is released that leaks: the adversarial suite and canary must show 0 leaks.
      - name: Privacy suite (0 leaks)
        run: cargo test -p dv-privacy
      # What she runs, on the system she runs it on: the vault opened again after a restart.
      - name: Vault, documents and updates on Windows
        run: cargo test --release -p dv-vault -p dv-egress -p dv-ingest -p dv-sandbox
      - name: Vault on the FIPS module
        run: cargo test --release -p dv-vault --features fips
      - name: First run (create, close, open again; the real Argon2 cost)
        run: cargo test --release -p dv-core --test first_run -- --ignored
      - name: Build the one-click installer
        run: pnpm tauri build --bundles nsis --features fips
        working-directory: apps/desktop
      - name: Fixed name and checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName DiagnosticVault-Setup.exe
          (Get-FileHash DiagnosticVault-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  DiagnosticVault-Setup.exe" | Out-File -Encoding ascii DiagnosticVault-Setup.exe.sha256
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="DiagnosticVault-Setup.exe DiagnosticVault-Setup.exe.sha256"
          # A release drafted in the GitHub page already exists: attach to it.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" \
              --title "כספת האבחון $GITHUB_REF_NAME" \
              --notes "להתקנה: להוריד את DiagnosticVault-Setup.exe וללחוץ עליו פעמיים. רק נתונים בדויים עד שכל תנאי שלב 8 מתקיימים (docs/external/README.md)."
          fi
