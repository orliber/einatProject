name: Release

# A release in minutes, from GitHub, with nothing new to fail (D-091).
#
# Nothing is built here. Every merge to main already built the Windows installer and the Mac
# disk image exactly as they are published, and ran every release check on them (ci.yml →
# windows-release, macos-release; D-101). This workflow takes both for the commit being
# released, checks they are the same commit and version, signs the update notice (D-033) and
# publishes:
#   1. a release in this repository, under the fixed names (D-026)
#   2. installer + notice + signature in the public installers repository; within a day every
#      installed copy offers "יש גרסה חדשה"
#
# Start it from Actions → Release → Run workflow (on main), or push a tag `v<version>`, or
# `scripts/release.sh <version>`. "rehearsal" does everything except publishing, on any
# branch, and signs with a key made for that run only (installed copies refuse it).
on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "חזרה בלבד: כל השלבים בלי לפרסם (חתימה במפתח חד-פעמי)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

# Read by default; only this job writes, and only to this repository's releases.
permissions:
  contents: read

# One release at a time; a second waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASES_REPO: orliber/einat-vault-releases

jobs:
  release:
    name: Sign and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and tag in this repository
      actions: read # the installer CI built for this commit
    env:
      REHEARSAL: ${{ inputs.rehearsal && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: What is released
        id: what
        run: |
          fail() { echo "::error::$*"; exit 1; }
          # The newest green CI run of a commit (not a pull request's): both the Windows installer
          # and the Mac disk image are taken from this one run, so they passed the same checks.
          green_run() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$1" --limit 20 --json databaseId,event,conclusion \
              -q '[.[] | select(.event != "pull_request" and .conclusion == "success")] | .[0].databaseId // empty'
          }
          sha="$GITHUB_SHA"
          run=""
          if [[ "$REHEARSAL" != "true" ]]; then
            git merge-base --is-ancestor "$sha" origin/main \
              || fail "only a commit on main is released (this is $GITHUB_REF_NAME). A rehearsal can run anywhere."
          fi
          # "Run workflow" on main releases the newest commit of main whose CI is green, so its
          # installer is built and checked. A merge whose CI is still running goes in the next
          # release instead of holding this one. A tag releases exactly its own commit.
          if [[ "$GITHUB_REF_TYPE" != "tag" && "$REHEARSAL" != "true" ]]; then
            sha=""
            for c in $(git rev-list --first-parent -n 30 "$GITHUB_SHA"); do
              # A failed lookup stops the release: read as "not green", it would quietly pick an
              # older commit and publish it under the same version.
              green="$(green_run "$c")" \
                || fail "could not read the CI runs of $c; nothing was published. Run this again."
              if [[ -n "$green" ]]; then sha="$c"; run="$green"; break; fi
            done
            [[ -n "$sha" ]] || fail "no commit among the last 30 on main has green CI yet. CI on main builds the installer after every merge (about 40 minutes): wait for it, then run this again."
            if [[ "$sha" != "$GITHUB_SHA" ]]; then
              echo "::notice::main is at $GITHUB_SHA, whose CI is not green yet; releasing $sha, the newest commit with a checked installer"
              git checkout -q "$sha"
            fi
          fi
          # A tag or a rehearsal takes exactly its own commit, and still only from a green run.
          if [[ -z "$run" ]]; then
            run="$(green_run "$sha")" || fail "could not read the CI runs of $sha; nothing was published. Run this again."
            [[ -n "$run" ]] || fail "CI for $sha is not green (or not finished) yet. CI builds the installers after every merge to main (about 40 minutes), and a rehearsal on a branch needs CI → Run workflow on that branch first. Wait for it to be green, then run this again."
          fi
          v="$(scripts/release-ready.sh)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$v" ]]; then
            fail "the tag is $GITHUB_REF_NAME but the version in the code is $v"
          fi
          if [[ "$REHEARSAL" != "true" ]]; then
            if gh release view "v$v" -R "$RELEASES_REPO" >/dev/null 2>&1; then
              # Right after a version PR is merged, its CI is still running and the newest green
              # commit is the version already out: wait for main, don't bump again.
              [[ "$sha" == "$GITHUB_SHA" ]] \
                || fail "version $v is already published, and main's newest commit ($GITHUB_SHA) is still in CI. Wait for CI on main to be green, then run this again."
              fail "version $v is already published in $RELEASES_REPO: a new version needs a new number (scripts/release.sh bump)"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "### $([[ $REHEARSAL == true ]] && echo 'חזרה על' || echo 'שחרור') גרסה $v" >> "$GITHUB_STEP_SUMMARY"
          echo "commit \`$sha\`, from [CI run $run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)" >> "$GITHUB_STEP_SUMMARY"

      # The installer of the one green CI run chosen above. It is uploaded only after every check
      # of that run passed (the windows-release job runs last), so it is never one that failed
      # anything.
      - name: The installer CI built and checked for this commit
        env:
          V: ${{ steps.what.outputs.version }}
          SHA: ${{ steps.what.outputs.sha }}
          RUN: ${{ steps.what.outputs.run }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ -n "$RUN" ]] || fail "no green CI run was chosen"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n release-windows -D release-out \
            || fail "CI run $RUN for $SHA is green but has no Windows installer (release-windows); nothing was published. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          echo "installer from CI run $RUN"
          cd release-out
          grep -qx "commit=$SHA" build.txt || fail "the installer was built from another commit: $(cat build.txt)"
          grep -qx "version=$V" build.txt || fail "the installer is of another version: $(cat build.txt)"
          # Written on Windows (CRLF): without the CR, sha256sum looks for the right name.
          for f in DiagnosticVault-Setup.exe.sha256 DiagnosticVault-sbom.cdx.json.sha256; do
            tr -d '\r' < "$f" | sha256sum -c -
          done
          head -c 2 DiagnosticVault-Setup.exe | grep -q MZ || fail "not a Windows program"

      # The Mac disk image of the same green CI run, checked the same way (D-101). Both or
      # nothing: a release never goes out with one platform's file missing.
      - name: The Mac disk image CI built and checked for this commit
        env:
          V: ${{ steps.what.outputs.version }}
          SHA: ${{ steps.what.outputs.sha }}
          RUN: ${{ steps.what.outputs.run }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          if ! gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n release-macos -D release-mac; then
            if ! git cat-file -e "$SHA:crates/dv-sandbox/src/macos.rs" 2>/dev/null; then
              fail "commit $SHA was built before the Mac version existed, so its CI made no Mac disk image. Merge to main once more (or wait for CI of the newest commit on main to be green), then run this again."
            fi
            fail "CI run $RUN for $SHA is green but has no Mac disk image (release-macos); nothing was published. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
          fi
          echo "Mac disk image from CI run $RUN"
          cd release-mac
          grep -qx "commit=$SHA" build.txt || fail "the disk image was built from another commit: $(cat build.txt)"
          grep -qx "version=$V" build.txt || fail "the disk image is of another version: $(cat build.txt)"
          sha256sum -c DiagnosticVault.dmg.sha256
          tail -c 512 DiagnosticVault.dmg | head -c 4 | grep -q koly || fail "not a Mac disk image"
          mv DiagnosticVault.dmg DiagnosticVault.dmg.sha256 ../release-out/

      # Built before the key is anywhere in the environment: no build script ever sees it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: The signing tool
        run: cargo build --locked --quiet -p xtask

      # The notice (version, notes, size, SHA-256) is signed and then checked with the
      # program's own verification code and the public key pinned in the code, before anything
      # is published. The key lives in a repository secret (D-091), is written to a file only
      # this step can read, and is deleted right after.
      - name: Sign the update notice
        env:
          V: ${{ steps.what.outputs.version }}
          SIGNING_KEY: ${{ secrets.DV_UPDATE_SIGNING_KEY }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          notes="release-notes/$V.txt"
          if [[ "$REHEARSAL" == "true" ]]; then
            target/debug/xtask update-notice --test-key "$V" release-out/DiagnosticVault-Setup.exe "$notes" release-out release-out/DiagnosticVault.dmg
            exit 0
          fi
          [[ -n "$SIGNING_KEY" ]] || fail "the secret DV_UPDATE_SIGNING_KEY is missing (docs/RELEASE_HE.md → פעם אחת). Or: scripts/release.sh $V on Or's Mac signs there."
          umask 077
          key="$RUNNER_TEMP/update-signing.pk8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SIGNING_KEY" | base64 -d > "$key" || fail "DV_UPDATE_SIGNING_KEY is not base64"
          DV_UPDATE_KEY="$key" target/debug/xtask update-notice "$V" release-out/DiagnosticVault-Setup.exe "$notes" release-out release-out/DiagnosticVault.dmg

      - name: Publish in this repository (fixed names, D-026)
        if: env.REHEARSAL != 'true'
        env:
          V: ${{ steps.what.outputs.version }}
          SHA: ${{ steps.what.outputs.sha }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          tag="v$V"
          files=(release-out/DiagnosticVault-Setup.exe release-out/DiagnosticVault-Setup.exe.sha256
                 release-out/DiagnosticVault.dmg release-out/DiagnosticVault.dmg.sha256
                 release-out/DiagnosticVault-sbom.cdx.json release-out/DiagnosticVault-sbom.cdx.json.sha256)
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
          else
            # A tag left by a release that never published (a failed build) moves to this commit.
            at="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [[ -n "$at" && "$at" != "$SHA" ]]; then
              echo "::notice::the tag $tag had no release and pointed at $at; it now points at $SHA"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null
            fi
            gh release create "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "כספת האבחון $V" --notes-file "release-notes/$V.txt"
          fi

      # Last, because this is what installed copies see.
      - name: Publish for installed copies
        if: env.REHEARSAL != 'true'
        env:
          V: ${{ steps.what.outputs.version }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ -n "$RELEASES_TOKEN" ]] || fail "the secret RELEASES_REPO_TOKEN is missing (docs/RELEASE_HE.md → פעם אחת)"
          GH_TOKEN="$RELEASES_TOKEN" gh release create "v$V" -R "$RELEASES_REPO" --latest \
            --title "כספת האבחון $V" --notes-file "release-notes/$V.txt" \
            release-out/DiagnosticVault-Setup.exe release-out/DiagnosticVault.dmg \
            release-out/latest.json release-out/latest.json.sig
          echo "פורסם: $GITHUB_SERVER_URL/$RELEASES_REPO/releases/tag/v$V" >> "$GITHUB_STEP_SUMMARY"

      # A rehearsal leaves what it would have published, to look at.
      - name: What would have been published
        if: env.REHEARSAL == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ steps.what.outputs.version }}
          path: release-out/
          retention-days: 7
