# One grouped pull request per ecosystem, so an update does not start many CI runs at once.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
      rust-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
      ui-major:
        update-types: [major]
