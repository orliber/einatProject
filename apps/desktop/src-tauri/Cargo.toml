[package]
name = "dv-desktop"
description = "Desktop shell: window, CSP, capabilities; delegates every command to dv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Same policy as the workspace, except `unsafe_code` is `deny` instead of `forbid`:
# Tauri's code-generation macros must be able to opt in locally.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Cutting a string inside a Hebrew letter panics the same way (F4).
string_slice = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
dv-core.workspace = true
dv-domain.workspace = true
dv-ingest.workspace = true
# The name model worker (SEC2): the app binary turns into it, like the document worker.
dv-ner.workspace = true
dv-privacy.workspace = true
dv-ipc.workspace = true
# Copying the Word file password: out of clipboard history and cloud sync, cleared after 60 s.
arboard = { version = "3.6.1", default-features = false }
zeroize = "1.9"
# The answer type of a request on its way (already used by every crate it talks to).
serde.workspace = true
serde_json.workspace = true
# The system's own "Save as" / "Open" windows for the encrypted backup (D-024). Called from Rust
# only: nothing is exposed to the webview. On Linux it uses GTK 3, already in the tree.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

[features]
# Release builds: all encryption on the FIPS 140-3 validated module (D-006). Needs CMake + Go.
fips = ["dv-core/fips"]

# The one module that calls Windows directly (`src/win_platform.rs`, D-047): working-set quota
# for locked memory, crash reporting and whether the session is locked. Already in the tree through Tauri's WebView2 bindings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }
