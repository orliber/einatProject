# תיק בדוי לחלוטין לבדיקות. אין קשר לאדם אמיתי.
case:
  code: "TEST-0001"
  age: "5:4"
identities:
  - { role: child,         tag: "[ילד]",       value: "נועם",  aliases: ["נועמי", "Noam"] }
  - { role: mother,        tag: "[אם]",        value: "רותם" }
  - { role: father,        tag: "[אב]",        value: "עידו" }
  - { role: sibling,       tag: "[אחות_1]",    value: "מאיה" }
  - { role: teacher,       tag: "[גננת]",      value: "מיכל" }
  - { role: doctor,        tag: "[רופא_1]",    value: "ד\"ר אבנר שטרן" }
  - { role: slp,           tag: "[קלינאית_1]", value: "הילה" }
  - { role: kindergarten,  tag: "[גן]",        value: "גן הדקל" }
  - { role: town,          tag: "[יישוב]",     value: "כפר ורדים" }
  - { role: id_number,     tag: "[ת.ז.]",      value: "000000018" }   # ת.ז. בדויה עם ספרת ביקורת תקינה
canaries:
  - "זרובבלית"   # שם-מלכודת: אסור שיופיע בשום payload
inputs:
  kindergarten: |
    מיכל הגננת סיפרה שנועם מתקשה במעברים בין פעילויות, אבל כשמכינים אותו מראש עם לוח תמונות הוא מסתדר.
    בחצר פחות משתתף. בקבוצה קטנה משתתף יותר. ב-14.9 לא רצה לצאת לחצר כשיובל ביקש לשחק איתו.
  intake: |
    רותם ועידו מתארים את נועמי כילד סקרן. אחותו מאיה בת 8. לפני כשנה עברו לכפר ורדים.
    ד"ר שטרן המליץ על אבחון פסיכולוגי. זרובבלית היא שם-מלכודת לבדיקה.
expected:
  unknown_name_suspects: ["יובל"]
  must_not_appear_in_payload: ["נועם", "נועמי", "רותם", "עידו", "מאיה", "מיכל", "שטרן", "הילה", "גן הדקל", "כפר ורדים", "000000018", "14.9", "זרובבלית"]
