<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>יומן, שבוע</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1e5b56}a:hover{color:#164541}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #1e5b56;outline-offset:2px}
.btn{min-height:40px;padding:0 16px;border-radius:10px;border:1px solid #cfd5d2;background:#fff;color:#15201f;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-primary{background:#1e5b56;border-color:#1e5b56;color:#fff}
.icon-btn{width:40px;height:40px;min-height:40px;padding:0;justify-content:center}
.seg{min-height:36px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:#34403e;font-weight:600}
</style>
</helmet>
<div dir="rtl" lang="he" style="font-family: Assistant, 'Segoe UI', system-ui, sans-serif; color: #15201f; background: #f4f5f3; min-height: 900px; font-size: 15px; line-height: 1.5">
  <main style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px">

    <!-- One line of tools; how to move a visit lives behind "?". -->
    <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px">
      <div role="radiogroup" aria-label="תצוגה" style="display: flex; gap: 2px; padding: 3px; background: #ffffff; border: 1px solid #e3e6e3; border-radius: 10px">
        <button type="button" role="radio" aria-checked="false" class="seg">יום</button>
        <button type="button" role="radio" aria-checked="true" class="seg" style="background: #1e5b56; color: #ffffff">שבוע</button>
        <button type="button" role="radio" aria-checked="false" class="seg">חודש</button>
      </div>
      <button type="button" class="btn">היום</button>
      <div style="display: flex; gap: 4px">
        <button type="button" class="btn icon-btn" aria-label="השבוע הקודם"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button type="button" class="btn icon-btn" aria-label="השבוע הבא"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      </div>
      <h1 style="margin: 0; font-size: 22px">15–19 בנובמבר 2026</h1>
      <span style="flex: 1 1 0"></span>
      <button type="button" class="btn icon-btn" aria-label="איך מזיזים פגישה" title="מצביעים על פגישה ולוחצים על החצים שבפינה שלה, או גוררים אותה."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5"></path><path d="M12 17h.01"></path></svg></button>
      <button type="button" class="btn btn-primary">+ פגישה חדשה</button>
    </div>

    <!-- The week from the start of the working day; today's column marked; "now" only there. -->
    <div style="overflow-x: auto; background: #ffffff; border: 1px solid #e3e6e3; border-radius: 14px">
      <div style="min-width: 760px">
        <div style="display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr)); border-bottom: 1px solid #e3e6e3">
          <span></span>
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="5">
            <div style="display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; border-inline-start: 1px solid #e3e6e3; background: {{d.headBg}}; border-bottom: 3px solid {{d.headLine}}">
              <b>{{d.name}}</b><span style="color: #4a5654; font-size: 14px">{{d.date}}</span>
              <span style="font-size: 12px; font-weight: 700; color: #1e5b56">{{d.todayWord}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr))">
          <div aria-hidden="true">
            <sc-for list="{{ hours }}" as="h" hint-placeholder-count="12">
              <div style="height: 52px; box-sizing: border-box; padding: 2px 10px 0; font-size: 12px; color: #4a5654; text-align: left; direction: ltr">{{h}}</div>
            </sc-for>
          </div>
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="5">
            <div style="position: relative; height: 624px; border-inline-start: 1px solid #e3e6e3; background-color: {{d.colBg}}; background-image: repeating-linear-gradient(to bottom, #eef0ee 0 1px, transparent 1px 52px)">
              <sc-for list="{{ d.visits }}" as="v" hint-placeholder-count="1">
                <button type="button" aria-label="{{v.label}}" style="position: absolute; inset-inline: 4px; top: {{v.top}}px; height: {{v.height}}px; box-sizing: border-box; padding: 4px 8px; border: 1px solid {{v.line}}; border-inline-start: 4px solid {{v.bar}}; border-radius: 8px; background: {{v.bg}}; text-align: start; overflow: hidden; display: flex; flex-direction: column; gap: 0; line-height: 1.35">
                  <span style="font-size: 13px; font-weight: 700"><span style="direction: ltr">{{v.time}}</span> {{v.who}}</span>
                  <span style="font-size: 12px; color: #34403e">{{v.kind}}</span>
                </button>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}">
                <div aria-hidden="true" style="position: absolute; inset-inline: 0; top: {{d.nowTop}}px; height: 2px; background: #d38a2c">
                  <span style="position: absolute; inset-inline-start: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #d38a2c"></span>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #34403e">
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #1e5b56"></span>פגישת היכרות</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #3b6ea5"></span>מפגש אבחון</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; background: #8a4e0c"></span>פגישת טיפול</span>
      <span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 3px; border: 1px dashed #4a5654; box-sizing: border-box"></span>זמן שמור</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ROW = 52, START = 8;
    const at = (t) => { const [h, m] = t.split(':').map(Number); return Math.round((h - START) * ROW + (m / 60) * ROW); };
    const KINDS = {
      intake: { kind: 'פגישת היכרות', bg: '#e6efed', bar: '#1e5b56', line: '#cfe0dc' },
      assess: { kind: 'מפגש אבחון', bg: '#e8eef6', bar: '#3b6ea5', line: '#cbd8ea' },
      treat: { kind: 'פגישת טיפול', bg: '#fbf1e2', bar: '#8a4e0c', line: '#ebcb98' },
      block: { kind: 'זמן שמור', bg: 'repeating-linear-gradient(-45deg, #f4f5f3 0 8px, #ffffff 8px 16px)', bar: '#a0a8a6', line: '#cfd5d2' }
    };
    const visit = (from, to, who, k) => {
      const kd = KINDS[k];
      return { time: from, who, kind: kd.kind, bg: kd.bg, bar: kd.bar, line: kd.line, top: at(from) + 1, height: at(to) - at(from) - 3, label: from + '–' + to + ' ' + who + ', ' + kd.kind };
    };
    const day = (name, date, today, visits) => ({
      name, date, today, visits,
      todayWord: today ? 'היום' : '',
      headBg: today ? '#f3f8f7' : '#ffffff',
      headLine: today ? '#1e5b56' : 'transparent',
      colBg: today ? '#f7fbfa' : '#ffffff',
      nowTop: at('15:12')
    });
    return {
      hours: ['08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'],
      days: [
        day('ראשון', '15.11', false, [visit('10:00', '11:00', 'יובל', 'treat')]),
        day('שני', '16.11', false, []),
        day('שלישי', '17.11', true, [
          visit('09:00', '10:30', 'תמר', 'assess'),
          visit('11:30', '12:30', 'איתי', 'intake'),
          visit('13:00', '15:00', 'כתיבת דוחות', 'block'),
          visit('16:00', '16:50', 'מאיה', 'treat')
        ]),
        day('רביעי', '18.11', false, [visit('09:00', '10:00', 'שירה', 'intake')]),
        day('חמישי', '19.11', false, [visit('16:00', '17:30', 'נועם', 'assess')])
      ]
    };
  }
}
</script>
</body>
</html>
