[package]
name = "dv-vault"
description = "Key hierarchy, encrypted storage, audit log and environment checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Build AES-GCM/HKDF/HMAC/DRBG on the FIPS 140-3 validated AWS-LC module (needs CMake + Go).
fips = ["aws-lc-rs/fips"]

[dependencies]
dv-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
unicode-normalization = "0.1"

# Removing the Windows Hello key pair of a vault that had it turned on (D-047, taken out in
# D-054). Already in the tree through Tauri's WebView2 bindings; only safe calls are used.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["std", "Foundation", "Security_Credentials"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
