[package]
name = "xtask"
description = "Repository checks: architecture invariants and the pre-commit data scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cargo_metadata = "0.23"
regex = "1"
# Reading the shell's command signatures for the generated IPC types (F5). Already in the
# tree through serde and thiserror; no new crate.
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
serde_json.workspace = true
# Signing updates (D-033): the program's own verification code, and the same crypto library.
dv-egress.workspace = true
# The encrypted copy of the signing key (SEC5): the vault's own password KDF and sealing.
dv-vault.workspace = true
zeroize = "1.9"
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
